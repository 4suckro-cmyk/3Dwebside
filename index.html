<!--

  販賣機、電信桿/電線、路燈、交通號誌、P 牌、腳踏車、雨衣粒子、濕地反射。
  比參考圖加強：UnrealBloom 輝光、路上倒影光條、積水與水花漣漪、路燈光錐、閃電、樹木微風。
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QWEN-FLASH 超商 · 雨夜街角</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0d1424;
    font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#d8dee9;}

    color:#ff8f7a;background:rgba(20,8,8,.72);border:1px solid #5a2424;border-radius:8px;padding:8px 10px;
    display:none;white-space:pre-wrap;}
  .panel{position:fixed;z-index:10;padding:10px 14px;background:rgba(13,19,34,.58);
    border:1px solid rgba(120,150,220,.25);border-radius:12px;-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);}
  #hud{left:0;right:0;bottom:20px;display:flex;justify-content:center;gap:12px;z-index:11;}
  .btn{border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:10px 20px;font:inherit;font-size:13px;
    color:#e2e7de;background:rgba(18,25,42,.6);cursor:pointer}
  .btn.on{background:rgba(60,90,150,.45);border-color:rgba(140,180,255,.5)}
</style>

  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<body>
<div id="vignette"></div>
<div class="panel" id="card" style="top:16px;left:16px;max-width:340px">
  <b style="color:#8fb6ff">QWEN-FLASH 超商 · 雨夜街角</b>
  <div style="font-size:12.3px;color:#9fb0c8;margin-top:6px">拖曳環視 · 滾輪縮放 · <b>R</b> 開關雨 · <b>C</b> 重置視角 · <b>L</b> 打一道閃電</div>
</div>

  el.textContent = (e.message||e.error) + '\n' + (e.filename||'') + ':' + (e.lineno||'');
});
setTimeout(function(){

    const e = document.getElementById('err'); e.style.display='block';
    e.textContent = 'three.js 模組載入失敗：file:// 請改用 CDN importmap；離線請用 node serve.mjs <port> 後以 http://127.0.0.1:<port>/… 開啟。';
  }
}, 12000);
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
window.__booted = true;

/* ---------- 工具 ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^(a>>>15), 1|a);t=t+Math.imul(t^(t>>>7), 61|t)^t;return((t^(t>>>14))>>>0)/4294967296;};}
const rng = mulberry32(20261016);
function R(a=1,b){ return b===undefined ? rng()*a : a+rng()*(b-a); }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function smooth(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function lerp(a,b,t){ return a+(b-a)*t; }
const TAU = Math.PI*2;
console.log('rng self-test:', Array.from({length:6},()=>+rng().toFixed(3)).join(', '));
function h3(x,y,z,k){ const s=Math.sin(x*127.1+y*311.7+z*74.7+k*13.7)*43758.5453; return s-Math.floor(s); }
function vnJs(x,y){ const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j;
  const s=(a,b)=>{const t=Math.sin(a*127.1+b*311.7)*43758.5453;return t-Math.floor(t);};
  const u=fx*fx*(3-2*fx), v=fy*fy*(3-2*fy);
  return lerp(lerp(s(i,j),s(i+1,j),u), lerp(s(i,j+1),s(i+1,j+1),u), v); }

/* ---------- renderer / scene / camera ---------- */
const HALF_X = 17, HALF_Z = 13;                 // 浮島半寬/半深 = 尺度錨點
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.5;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x17223c, 0.0085);

const CAM0 = new THREE.Vector3(2, 16.5, 30);
const TGT0 = new THREE.Vector3(0, 1.2, -1);
const camera = new THREE.PerspectiveCamera(36, innerWidth/innerHeight, 0.4, 600);
camera.position.copy(CAM0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TGT0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 8;
controls.maxDistance = 80;
controls.maxPolarAngle = 1.46;

/* ---------- 天空穹頂（漸層） ---------- */
const skyCan = document.createElement('canvas'); skyCan.width=4; skyCan.height=256;
{
  const g = skyCan.getContext('2d');
  const gr = g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0, '#101a30'); gr.addColorStop(0.55, '#1c2846'); gr.addColorStop(1, '#324268');
  g.fillStyle = gr; g.fillRect(0,0,4,256);
}
const skyTex = new THREE.CanvasTexture(skyCan); skyTex.colorSpace = THREE.SRGBColorSpace;
const sky = new THREE.Mesh(new THREE.SphereGeometry(240, 32, 16),
  new THREE.MeshBasicMaterial({map:skyTex, side:THREE.BackSide, fog:false}));
scene.add(sky);

/* ---------- CanvasTexture 工具 ---------- */
function canTex(w,h,draw){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4; return t;
}
const CJK = '"Microsoft JhengHei","Noto Sans TC",sans-serif';

// 招牌：QWEN-FLASH 超商 + 藍色波浪 logo + 24H 綠章
const signTex = canTex(1200,144,(g,w,h)=>{
  g.fillStyle='#eef2f7'; g.fillRect(0,0,w,h);
  const gr=g.createLinearGradient(0,0,0,h); gr.addColorStop(0,'rgba(255,255,255,.9)'); gr.addColorStop(1,'rgba(190,200,215,.9)');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
  g.lineWidth=11; g.lineCap='round';
  ['#2f6fce','#4d8ae0','#79aaee'].forEach((col,i)=>{
    g.strokeStyle=col; g.beginPath(); g.arc(86,86, 40-i*11, Math.PI*1.05, Math.PI*1.95); g.stroke();
  });
  g.fillStyle='#16233d'; g.font='bold 74px '+CJK; g.textBaseline='middle';
  g.fillText('QWEN-FLASH 超商', 160, 74);
  g.fillStyle='#27a35c';
  const rx=1020, ry=32, rw=150, rh=80, rr=40;
  g.beginPath(); g.moveTo(rx+rr,ry); g.arcTo(rx+rw,ry,rx+rw,ry+rh,rr); g.arcTo(rx+rw,ry+rh,rx,ry+rh,rr);
  g.arcTo(rx,ry+rh,rx,ry,rr); g.arcTo(rx,ry,rx+rw,ry,rr); g.fill();
  g.fillStyle='#fff'; g.font='bold 46px '+CJK; g.textAlign='center';
  g.fillText('24H', rx+rw/2, ry+rh/2+2);
});

// 直式粉紅霓虹
const neonTex = canTex(256,640,(g,w,h)=>{
  g.clearRect(0,0,w,h);
  g.fillStyle='rgba(12,8,14,0.35)'; g.fillRect(0,0,w,h);
  g.textAlign='center'; g.textBaseline='middle';
  g.shadowColor='#ff4f8b'; g.shadowBlur=26;
  g.fillStyle='#ff6ba4'; g.font='bold 150px '+CJK;
  const chars=['2','4','H'];
  chars.forEach((ch,i)=> g.fillText(ch, w/2, 130+i*160));
  g.shadowBlur=12; g.fillStyle='#ffc3d8'; g.font='bold 56px '+CJK;
  g.fillText('OPEN', w/2, 600);
});

// 販賣機面板
const vendTex = canTex(256,384,(g,w,h)=>{
  g.fillStyle='#dfe6ee'; g.fillRect(0,0,w,h);
  g.fillStyle='#101826'; g.fillRect(14,14,w-28,56);
  g.fillStyle='#ff5f7e'; g.font='bold 34px sans-serif'; g.textAlign='center'; g.fillText('QWEN·VEND', w/2, 52);
  const cols=['#ff6f61','#ffb347','#8fd45f','#5fb7ff','#b48cff','#ffd75f','#ff8fb2','#6fe0c8',
              '#ff9d5c','#7ea8ff','#63d9a1','#f2c14e'];
  let k=0;
  for (let r=0;r<3;r++) for (let c=0;c<4;c++){
    g.fillStyle='#2a3446'; g.fillRect(20+c*54, 84+r*72, 46, 60);
    g.fillStyle=cols[k++%cols.length]; g.fillRect(26+c*54, 92+r*72, 34, 42);
    g.fillStyle='rgba(255,255,255,.5)'; g.fillRect(26+c*54, 92+r*72, 34, 8);
  }
  g.fillStyle='#eef3f8'; g.fillRect(18,308,w-36,60);
  g.fillStyle='#22304a'; g.font='bold 22px sans-serif'; g.fillText('24H HOT & COLD', w/2, 344);
});

// 地磚
const tileTex = canTex(512,512,(g,w,h)=>{
  g.fillStyle='#3d4a66'; g.fillRect(0,0,w,h);
  for (let i=0;i<900;i++){ const v=10+vnJs(i*0.37,i*0.11)*22;
    g.fillStyle=`rgba(${v+20},${v+26},${v+40},0.25)`;
    g.fillRect(Math.random()*w, Math.random()*h, 2, 2); }
  g.strokeStyle='rgba(120,140,180,0.22)'; g.lineWidth=2;
  for (let i=0;i<=8;i++){ g.beginPath(); g.moveTo(i*64,0); g.lineTo(i*64,h); g.stroke();
    g.beginPath(); g.moveTo(0,i*64); g.lineTo(w,i*64); g.stroke(); }
});
tileTex.wrapS = tileTex.wrapT = THREE.RepeatWrapping;

// 柏油
const asphaltTex = canTex(512,512,(g,w,h)=>{
  g.fillStyle='#202633'; g.fillRect(0,0,w,h);
  for (let i=0;i<1600;i++){ const v=14+vnJs(i*0.29,i*0.17)*20;
    g.fillStyle=`rgba(${v+8},${v+10},${v+16},0.30)`;
    g.fillRect(Math.random()*w, Math.random()*h, 2, 2); }
  g.fillStyle='rgba(30,36,50,0.14)';
  for (let i=0;i<14;i++){ g.beginPath(); g.ellipse(Math.random()*w,Math.random()*h, 30+Math.random()*70, 16+Math.random()*34, Math.random()*3, 0, TAU); g.fill(); }
});
asphaltTex.wrapS = asphaltTex.wrapT = THREE.RepeatWrapping;

// WELCOME 地墊
const matTex = canTex(256,128,(g,w,h)=>{
  g.fillStyle='#1b2a4a'; g.fillRect(0,0,w,h);
  g.strokeStyle='#e8eef6'; g.lineWidth=6; g.strokeRect(8,8,w-16,h-16);
  g.fillStyle='#e8eef6'; g.font='bold 44px sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText('WELCOME', w/2, h/2+2);
});
// 小看板
const boardTex = canTex(256,320,(g,w,h)=>{
  g.fillStyle='#f3f6fa'; g.fillRect(0,0,w,h);
  g.fillStyle='#16233d'; g.font='bold 34px '+CJK; g.textAlign='center'; g.fillText('QWEN-FLASH', w/2, 56);
  g.fillText('超商', w/2, 100);
  g.fillStyle='#27a35c'; g.fillRect(40,130,w-80,44);
  g.fillStyle='#fff'; g.font='bold 30px sans-serif'; g.fillText('24H', w/2, 154);
  g.fillStyle='#8b97ab';
  for (let i=0;i<4;i++) g.fillRect(36, 200+i*26, w-72, 8);
});
// P 牌
const pTex = canTex(128,128,(g,w,h)=>{
  g.fillStyle='#2f5fd0'; g.fillRect(0,0,w,h);
  g.strokeStyle='#fff'; g.lineWidth=6; g.strokeRect(8,8,w-16,h-16);
  g.fillStyle='#fff'; g.font='bold 88px sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText('P', w/2, h/2+4);
});
// 反射光條（上亮下淡）
const streakTex = canTex(64,256,(g,w,h)=>{
  const gr = g.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,'rgba(255,255,255,0.95)'); gr.addColorStop(0.35,'rgba(255,255,255,0.45)');
  gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
});
// 徑向光池
const radialTex = canTex(256,256,(g,w,h)=>{
  const gr = g.createRadialGradient(w/2,h/2,4, w/2,h/2, w/2);
  gr.addColorStop(0,'rgba(255,255,255,0.9)'); gr.addColorStop(0.6,'rgba(255,255,255,0.28)');
  gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
});

/* ---------- 基本幾何工具 ---------- */
const world = new THREE.Group(); scene.add(world);
function box(w,h,d, mat, x,y,z, shadow=true){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.castShadow=shadow; m.receiveShadow=true; world.add(m); return m;
}
function cyl(rt,rb,h, mat, x,y,z, seg=10){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; world.add(m); return m;
}
function planeOnGround(w,d, mat, x,z, y){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,d), mat);
  m.rotation.x = -Math.PI/2; m.position.set(x,y,z); m.receiveShadow=true; world.add(m); return m;
}

/* ---------- 材質 ---------- */
const M = {
  slabSide:  new THREE.MeshStandardMaterial({color:0x141b2a, roughness:1}),
  plaza:     new THREE.MeshStandardMaterial({map:tileTex, color:0xc8d1e2, roughness:0.85}),
  asphalt:   new THREE.MeshStandardMaterial({map:asphaltTex, color:0xb8c1d2, roughness:0.38, metalness:0.15}),
  paintWhite:new THREE.MeshStandardMaterial({color:0xe6ecf4, roughness:0.6}),
  wall:      new THREE.MeshStandardMaterial({color:0xa5afbd, roughness:0.9}),
  wallDark:  new THREE.MeshStandardMaterial({color:0x3c4760, roughness:0.95}),
  roof:      new THREE.MeshStandardMaterial({color:0x2a3040, roughness:0.9}),
  metalDark: new THREE.MeshStandardMaterial({color:0x272d38, roughness:0.6, metalness:0.5}),
  poleWood:  new THREE.MeshStandardMaterial({color:0x5d4630, roughness:1}),
  poleMetal: new THREE.MeshStandardMaterial({color:0x3a4250, roughness:0.6, metalness:0.4}),
  glass:     new THREE.MeshStandardMaterial({color:0x7fa8d0, transparent:true, opacity:0.16, roughness:0.05, metalness:0.2, side:THREE.DoubleSide, depthWrite:false}),
  trunk:     new THREE.MeshStandardMaterial({color:0x5d4833, roughness:1, flatShading:true}),
  leafA:     new THREE.MeshStandardMaterial({color:0x377050, roughness:1, flatShading:true}),
  leafB:     new THREE.MeshStandardMaterial({color:0x448362, roughness:1, flatShading:true}),
  hydrant:   new THREE.MeshStandardMaterial({color:0xc23a3a, roughness:0.6}),
  red:       new THREE.MeshStandardMaterial({color:0x8a2f3a, roughness:0.6, metalness:0.3}),
  warmGlow:  new THREE.MeshStandardMaterial({color:0x000000, emissive:0xffc877, emissiveIntensity:0.9}),
};
function puddleMat(){ return new THREE.MeshStandardMaterial({color:0x0a0e16, roughness:0.04, metalness:0.75}); }
function streakMat(color, opacity){ return new THREE.MeshBasicMaterial({map:streakTex, color, transparent:true, opacity, blending:THREE.AdditiveBlending, depthWrite:false}); }
function poolMat(color, opacity){ return new THREE.MeshBasicMaterial({map:radialTex, color, transparent:true, opacity, blending:THREE.AdditiveBlending, depthWrite:false}); }

/* ---------- 燈 ---------- */
const hemi = new THREE.HemisphereLight(0x41588a, 0x161d2e, 1.7); scene.add(hemi);
const moon = new THREE.DirectionalLight(0xb4cdea, 2.3);
moon.position.set(-20, 24, -12);
moon.castShadow = true;
moon.shadow.mapSize.set(2048,2048);
moon.shadow.camera.left=-24; moon.shadow.camera.right=24; moon.shadow.camera.top=20; moon.shadow.camera.bottom=-20;
moon.shadow.bias=-0.0006; moon.shadow.normalBias=0.04;
scene.add(moon);
const rim = new THREE.DirectionalLight(0x4a75a8, 0.6); rim.position.set(18,10,14); scene.add(rim);

/* ---------- 浮島基底 ---------- */
const island = box(HALF_X*2, 2.6, HALF_Z*2, M.slabSide, 0, -1.3, 0, false);
island.castShadow = false;
function slab(w,d, mat, x,z, topY, rx, rz){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.2, d), mat);
  m.position.set(x, topY-0.1, z); m.receiveShadow = true; world.add(m);
  if (rx) { m.material = mat; }
  return m;
}
// 店前廣場（地磚）
{ const t = tileTex.clone(); t.needsUpdate=true; t.repeat.set(6,4);
  const mat2 = M.plaza.clone(); mat2.map = t;
  slab(24, 12, mat2, -5.5, -6.5, 0.14); }
// 右後側空地（柏油）
{ const t = asphaltTex.clone(); t.needsUpdate=true; t.repeat.set(3,4);
  const mat2 = M.asphalt.clone(); mat2.map = t;
  slab(10, 12, mat2, 12.5, -6.5, 0.12); }
// 道路
{ const t = asphaltTex.clone(); t.needsUpdate=true; t.repeat.set(9,1.2);
  const mat2 = M.asphalt.clone(); mat2.map = t;
  slab(34, 4, mat2, 0, 3.0, 0.10); }
// 人行道細帶
{ const t = tileTex.clone(); t.needsUpdate=true; t.repeat.set(9,0.7);
  const mat2 = M.plaza.clone(); mat2.map = t;
  slab(34, 2.4, mat2, 0, 6.2, 0.16); }
// 停車場
{ const t = asphaltTex.clone(); t.needsUpdate=true; t.repeat.set(5,1.6);
  const mat2 = M.asphalt.clone(); mat2.map = t;
  slab(19, 5.6, mat2, 7.5, 10.2, 0.12); }

/* ---------- 路面標記 ---------- */
// 斑馬線（在店門前）
for (let i=0;i<6;i++){
  const s = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.07, 0.5), M.paintWhite);
  s.position.set(-2.6, 0.14, 1.25 + i*0.72); s.receiveShadow=true; world.add(s);
}
// 車道虛線
for (let x=-16; x<=16; x+=2.6){
  if (Math.abs(x+2.6) < 2.7) continue;
  const d = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.05, 0.12), M.paintWhite);
  d.position.set(x, 0.13, 3.0); world.add(d);
}
// 停車格線
for (const lx of [7.6, 11.1, 15.4]){
  const l = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.05, 4.6), M.paintWhite);
  l.position.set(lx, 0.15, 9.9); world.add(l);
}
// 人孔蓋
for (const [mx,mz,my,my2] of [[-9.6,-1.2,0.147,0.147],[11.8,1.7,0.107,0.107]]){
  const c = new THREE.Mesh(new THREE.CircleGeometry(0.5, 20),
    new THREE.MeshStandardMaterial({color:0x10141c, roughness:0.8}));
  c.rotation.x=-Math.PI/2; c.position.set(mx, my, mz); world.add(c);
}
// 積水（濕亮）
for (const [px,pz,pr,py] of [[-8.5,3.2,0.95,0.115],[13.5,3.4,0.8,0.115],[-12,-2.5,1.1,0.15],[3.5,0.3,0.7,0.155]]){
  const p = new THREE.Mesh(new THREE.CircleGeometry(pr, 24), puddleMat());
  p.rotation.x=-Math.PI/2; p.scale.set(1,0.55,1); p.position.set(px,py,pz); world.add(p);
}

/* ---------- 英雄物件：QWEN-FLASH 超商 ---------- */
const store = new THREE.Group(); world.add(store);
function sbox(w,h,d, mat, x,y,z){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; store.add(m); return m; }

const trees = [];
function addTree(x, z, s){
  const g = new THREE.Group(); g.position.set(x, 0.16, z); world.add(g);
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12*s, 0.18*s, 1.6*s, 7), M.trunk);
  trunk.position.y = 0.8*s; trunk.castShadow=true; g.add(trunk);
  const canopy = new THREE.Group(); canopy.position.y = 1.8*s; g.add(canopy);
  const cA = new THREE.Mesh(new THREE.IcosahedronGeometry(0.95*s, 1), (x+z)%2? M.leafA : M.leafB);
  cA.position.y = 0.55*s; cA.castShadow=true; canopy.add(cA);
  const cB = new THREE.Mesh(new THREE.IcosahedronGeometry(0.62*s, 1), M.leafB);
  cB.position.set(0.5*s, 0.15*s, 0.25*s); cB.castShadow=true; canopy.add(cB);
  trees.push({group:canopy, phase: R(0,TAU), amp: 0.02+0.012*s});
}

function makeCar(bodyColor, opts={}){
  const g = new THREE.Group();
  const paint = new THREE.MeshStandardMaterial({color:bodyColor, roughness:0.28, metalness:0.65});
  const L = opts.l||3.7, W = opts.w||1.85, bodyH = opts.bodyH||0.62, bodyY = 0.78;
  const body = new THREE.Mesh(new THREE.BoxGeometry(W, bodyH, L), paint);
  body.position.y = bodyY; body.castShadow=true; body.receiveShadow=true; g.add(body);
  if (opts.pickup){
    const cab = new THREE.Mesh(new THREE.BoxGeometry(W*0.92, 0.55, 1.5), paint);
    cab.position.set(0, bodyY+bodyH/2+0.27, -L*0.22); cab.castShadow=true; g.add(cab);
    const bedTop = new THREE.Mesh(new THREE.BoxGeometry(W*0.9, 0.1, 1.9), new THREE.MeshStandardMaterial({color:0xb7bec9, roughness:0.5, metalness:0.4}));
    bedTop.position.set(0, bodyY+bodyH/2+0.05, L*0.2); bedTop.castShadow=true; g.add(bedTop);
  } else {
    const cab = new THREE.Mesh(new THREE.BoxGeometry(W*0.88, 0.52, 1.9),
      new THREE.MeshStandardMaterial({color:0x1a2230, roughness:0.1, metalness:0.4}));
    cab.position.set(0, bodyY+bodyH/2+0.26, -L*0.12); cab.castShadow=true; g.add(cab);
  }
  const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.26, 14);
  const wheelMat = new THREE.MeshStandardMaterial({color:0x14181f, roughness:0.9});
  for (const sx of [-1,1]) for (const sz of [-1,1]){
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI/2;
    w.position.set(sx*(W/2-0.05), 0.4, sz*L*0.32);
    w.castShadow=true; g.add(w);
  }
  for (const sx of [-1,1]){
    const tl = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.12, 0.05),
      new THREE.MeshStandardMaterial({emissive:0xff2626, emissiveIntensity:1.5, color:0x000000}));
    tl.position.set(sx*(W/2-0.28), bodyY+0.08, L/2+0.03); g.add(tl);
  }
  const tlLight = new THREE.PointLight(0xff3030, 0.7, 3.2, 2);
  tlLight.position.set(0, bodyY, L/2+0.3); g.add(tlLight);
  world.add(g);
  return g;
}

function animate(){
  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;
  // 雨
  if (rainOn){
    const p = rainGeo.attributes.position.array;
    for (let i=0;i<RAIN_N;i++){
      const v = rainSpd[i]*dt;
      p[i*6+1] -= v; p[i*6+4] -= v;
      if (p[i*6+1] < 0){
        const dy = p[i*6+1];
        p[i*6+1] = 34 + dy; p[i*6+4] = p[i*6+1] + RAIN_LEN;
        p[i*6+0] = R(-30,30); p[i*6+3] = p[i*6+0]+RAIN_TILT*RAIN_LEN;
        p[i*6+2] = R(-24,24); p[i*6+5] = p[i*6+2];
      }
    }
    rainGeo.attributes.position.needsUpdate = true;
    // 水花
    for (let i=0;i<SPL_N;i++){
      const s = splashState[i];
      s.life += dt * R(0.8,1.2) * 1.4;
      if (s.life > 1){ const [x,z,y]=splashSpot(); s.x=x; s.z=z; s.y=y; s.life=0; }
      const sc = 0.3 + 1.9*s.life;
      _pv.set(s.x, s.y, s.z); _sc.set(sc, sc, sc);
      _m4.compose(_pv, _q, _sc);
      splashes.setMatrixAt(i, _m4);
      const a = 1 - s.life;
      _col.setRGB(0.55*a, 0.62*a, 0.78*a);
      splashes.setColorAt(i, _col);
    }
    splashes.instanceMatrix.needsUpdate = true;
    if (splashes.instanceColor) splashes.instanceColor.needsUpdate = true;
  }
  // 樹木微風
  for (const tr of trees){
    tr.group.rotation.z = Math.sin(t*1.1 + tr.phase) * tr.amp;
    tr.group.rotation.x = Math.cos(t*0.8 + tr.phase*2) * tr.amp * 0.7;
  }
  // 燈光細微閃爍
  storeLight.intensity = 75 * (0.965 + 0.035*Math.sin(t*11) + 0.02*vnJs(t*3, 3.1));
  vendLight.intensity = 5 * (0.97 + 0.03*vnJs(t*2.2, 7.7));
  // 閃電
  if (t > nextFlash){ strike(); nextFlash = t + R(14, 30); }
  flash *= Math.exp(-5.5*dt);
  if (flash > 0.005){
    hemi.intensity = 1.7 + flash*3.2;
    moon.intensity = 2.3 + flash*2.2;
  } else { hemi.intensity = 1.7; moon.intensity = 2.3; }
  controls.update();
  composer.render();
  requestAnimationFrame(animate);
}
animate();

/* ---------- 除錯掛鉤 ---------- */
window.__ready = true;
window.__dbg = { THREE, scene, camera, controls, renderer, composer, bloom,
  rain, rainCount: RAIN_N, splashes, trees, cars, store, storeLight, vend, vendLight,
  lampLight, tlGreen, streaks, sky,
  strike, time: () => t };

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
